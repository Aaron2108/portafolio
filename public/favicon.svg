<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="omBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="omBorderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Space Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#060814" stroke="url(#omBorderGrad)" stroke-width="2.5" />

  <!-- Subtle Ambient Glow Behind Letters -->
  <circle cx="32" cy="32" r="18" fill="url(#omBrandGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Monogram OM -->
  <text
    x="32"
    y="40"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Space Grotesk', 'Inter', sans-serif"
    font-weight="900"
    font-size="28"
    letter-spacing="-1"
    fill="url(#omBrandGrad)"
  >OM</text>

  <!-- Accent Status Dot (Cyan tech spark) -->
  <circle cx="50" cy="16" r="3.5" fill="#06B6D4" />
</svg>
